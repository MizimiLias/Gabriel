[project]
name = "gabriel-agent"
version = "0.1.0"
description = "A local-first LangChain chat agent exposed through FastAPI."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.120,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain[mcp]>=1.4,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "qq-botpy==1.2.1",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "sse-starlette>=3.0,<4",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["botpy", "botpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.integrations.qq.connector"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::langchain_core._api.LangChainBetaWarning",
]
markers = [
    "integration: requires a PostgreSQL test database",
    "provider: calls the configured live LLM provider",
]
